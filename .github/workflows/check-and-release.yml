name: Check and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Package website
        run: cd outputs/public_html && zip -r ../Spectrum-Website.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: spectrum-build
          path: |
            outputs/Spectrum-Website.zip
            outputs/Spectrum.html
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spectrum-build
          path: outputs
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" outputs/Spectrum-Website.zip outputs/Spectrum.html --title "Spectrum $RELEASE_TAG" --generate-notes
